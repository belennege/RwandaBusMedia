<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Rwanda Bus Media | Control Centre</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f7fb;
            color: #1f2937;
            min-height: 100vh;
        }

        /* HEADER */

        header {
            background: linear-gradient(
                135deg,
                #123c69,
                #1d6fa5
            );

            color: white;
            padding: 25px 40px;

            box-shadow:
                0 4px 15px rgba(0,0,0,0.12);
        }

        .header-content {
            max-width: 1200px;
            margin: auto;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand h1 {
            font-size: 28px;
            margin-bottom: 6px;
        }

        .brand p {
            font-size: 14px;
            opacity: 0.9;
        }

        .system-status {
            background: rgba(255,255,255,0.15);
            padding: 10px 17px;
            border-radius: 25px;
            font-size: 14px;
        }

        .online-dot {
            display: inline-block;

            width: 10px;
            height: 10px;

            background: #39d98a;
            border-radius: 50%;

            margin-right: 7px;
        }

        /* MAIN */

        main {
            max-width: 1200px;
            margin: 35px auto;
            padding: 0 20px;
        }

        .page-title {
            margin-bottom: 25px;
        }

        .page-title h2 {
            font-size: 28px;
            color: #123c69;
            margin-bottom: 7px;
        }

        .page-title p {
            color: #6b7280;
        }

        /* SUMMARY */

        .summary {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .summary-card {
            background: white;
            padding: 22px;

            border-radius: 14px;

            box-shadow:
                0 3px 12px rgba(0,0,0,0.07);
        }

        .summary-card h3 {
            font-size: 14px;
            color: #6b7280;
            margin-bottom: 10px;
        }

        .summary-number {
            font-size: 30px;
            font-weight: bold;
            color: #123c69;
        }

        /* BUS GRID */

        .bus-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 22px;
        }

        .bus-card {
            background: white;

            border-radius: 16px;

            padding: 24px;

            box-shadow:
                0 5px 18px rgba(0,0,0,0.08);

            border-top: 5px solid #1d6fa5;

            transition:
                transform 0.2s,
                box-shadow 0.2s;
        }

        .bus-card:hover {
            transform: translateY(-3px);

            box-shadow:
                0 8px 25px rgba(0,0,0,0.12);
        }

        .bus-header {
            display: flex;
            justify-content: space-between;
            align-items: center;

            margin-bottom: 18px;
        }

        .bus-name {
            font-size: 21px;
            font-weight: bold;
            color: #123c69;
        }

        /* STATUS */

        .status {
            padding: 6px 11px;
            border-radius: 20px;

            font-size: 12px;
            font-weight: bold;
        }

        .status-online {
            background: #dcfce7;
            color: #15803d;
        }

        .status-offline {
            background: #fee2e2;
            color: #b91c1c;
        }

        /* ROUTE */

        .route {
            background: #f8fafc;

            padding: 12px;

            border-radius: 9px;

            margin-bottom: 18px;

            color: #4b5563;

            font-size: 14px;
        }

        /* INFO */

        .info-row {
            display: flex;
            justify-content: space-between;

            margin-bottom: 13px;

            font-size: 14px;
        }

        .info-label {
            color: #6b7280;
        }

        .info-value {
            font-weight: bold;
        }

        /* PLAY STATUS */

        .play-status {
            display: inline-block;

            padding: 5px 9px;

            border-radius: 15px;

            font-size: 11px;

            font-weight: bold;
        }

        .playing {
            background: #dcfce7;
            color: #15803d;
        }

        .stopped {
            background: #f1f5f9;
            color: #64748b;
        }

        /* CONTROLS */

        .control-section {
            margin-top: 20px;

            padding-top: 18px;

            border-top:
                1px solid #e5e7eb;
        }

        label {
            display: block;

            font-size: 13px;

            font-weight: bold;

            margin-bottom: 7px;

            color: #374151;
        }

        select {
            width: 100%;

            padding: 11px;

            border:
                1px solid #d1d5db;

            border-radius: 8px;

            background: white;

            margin-bottom: 15px;

            font-size: 14px;

            cursor: pointer;
        }

        select:focus {
            outline: none;

            border-color: #1d6fa5;

            box-shadow:
                0 0 0 2px
                rgba(29,111,165,0.12);
        }

        .volume-buttons {
            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 7px;

            margin-bottom: 13px;
        }

        button {
            border: none;

            border-radius: 8px;

            padding: 10px;

            cursor: pointer;

            font-weight: bold;

            transition:
                transform 0.1s,
                opacity 0.2s;
        }

        button:hover {
            opacity: 0.85;
        }

        button:active {
            transform: scale(0.97);
        }

        .volume-button {
            background: #e8f1f8;
            color: #123c69;
        }

        .play-button {
            width: 100%;

            background: #16a34a;

            color: white;

            margin-bottom: 8px;
        }

        .stop-button {
            width: 100%;

            background: #dc3545;

            color: white;
        }

        .button-icon {
            margin-right: 5px;
        }

        /* NOTIFICATION */

        #notification {
            position: fixed;

            right: 25px;
            bottom: 25px;

            background: #123c69;

            color: white;

            padding: 15px 20px;

            border-radius: 10px;

            box-shadow:
                0 5px 20px
                rgba(0,0,0,0.2);

            display: none;

            z-index: 1000;

            max-width: 340px;

            font-size: 14px;
        }

        /* FOOTER */

        footer {
            text-align: center;

            color: #6b7280;

            font-size: 13px;

            padding: 35px 20px;
        }

        /* RESPONSIVE */

        @media (max-width: 900px) {

            .bus-grid {
                grid-template-columns: 1fr;
            }

            .summary {
                grid-template-columns: 1fr;
            }

            .header-content {
                flex-direction: column;
                gap: 15px;
                text-align: center;
            }

        }

    </style>

</head>


<body>


<header>

    <div class="header-content">

        <div class="brand">

            <h1>🚌 Rwanda Bus Media</h1>

            <p>
                Central Bus Advertisement Control Centre
            </p>

        </div>


        <div class="system-status">

            <span class="online-dot"></span>

            System Online

        </div>

    </div>

</header>


<main>


    <div class="page-title">

        <h2>
            Bus Control Dashboard
        </h2>

        <p>
            Monitor buses and remotely manage
            advertisements and audio volume.
        </p>

    </div>


    <!-- SUMMARY -->

    <div class="summary">

        <div class="summary-card">

            <h3>
                Total Buses
            </h3>

            <div
                class="summary-number"
                id="total-buses">

                0

            </div>

        </div>


        <div class="summary-card">

            <h3>
                Online Buses
            </h3>

            <div
                class="summary-number"
                id="online-buses">

                0

            </div>

        </div>


        <div class="summary-card">

            <h3>
                Last Updated
            </h3>

            <div
                class="summary-number"
                id="last-updated"
                style="font-size:18px;">

                --

            </div>

        </div>

    </div>


    <!-- BUS CARDS -->

    <div
        class="bus-grid"
        id="bus-grid">

    </div>


</main>


<footer>

    Rwanda Bus Media © 2026

    <br>

    Remote Advertisement Management System

</footer>


<div id="notification"></div>


<script>


const API_URL =
    "http://127.0.0.1:5000";


/* =========================
   NOTIFICATION
========================= */


function showNotification(message) {

    const notification =
        document.getElementById(
            "notification"
        );


    notification.textContent =
        message;


    notification.style.display =
        "block";


    setTimeout(() => {

        notification.style.display =
            "none";

    }, 3000);

}


/* =========================
   LOAD BUSES
========================= */


async function loadBuses() {

    try {

        const response =
            await fetch(
                `${API_URL}/buses`
            );


        const buses =
            await response.json();


        document.getElementById(
            "total-buses"
        ).textContent =
            buses.length;


        const online =
            buses.filter(
                bus =>
                    bus.status === "ONLINE"
            ).length;


        document.getElementById(
            "online-buses"
        ).textContent =
            online;


        document.getElementById(
            "last-updated"
        ).textContent =
            new Date().toLocaleTimeString();


        const grid =
            document.getElementById(
                "bus-grid"
            );


        grid.innerHTML = "";


        buses.forEach(bus => {

            grid.innerHTML +=
                createBusCard(bus);

        });


    } catch (error) {

        console.error(error);

        showNotification(
            "Could not connect to the bus server."
        );

    }

}


/* =========================
   CREATE BUS CARD
========================= */


function createBusCard(bus) {

    const statusClass =
        bus.status === "ONLINE"
            ? "status-online"
            : "status-offline";


    const statusText =
        bus.status === "ONLINE"
            ? "● ONLINE"
            : "● OFFLINE";


    const isStopped =
        bus.current_ad === "STOPPED";


    const playbackStatus =
        isStopped
            ? `
                <span class="play-status stopped">
                    STOPPED
                </span>
              `
            : `
                <span class="play-status playing">
                    ▶ PLAYING
                </span>
              `;


    return `

        <div class="bus-card">


            <div class="bus-header">

                <div class="bus-name">

                    🚌 ${bus.bus_id}

                </div>


                <div
                    class="status ${statusClass}">

                    ${statusText}

                </div>

            </div>


            <div class="route">

                📍 ${bus.route}

            </div>


            <div class="info-row">

                <span class="info-label">
                    Advertisement
                </span>

                <span class="info-value">
                    ${bus.current_ad}
                </span>

            </div>


            <div class="info-row">

                <span class="info-label">
                    Playback
                </span>

                <span>
                    ${playbackStatus}
                </span>

            </div>


            <div class="info-row">

                <span class="info-label">
                    Current Volume
                </span>

                <span class="info-value">
                    ${bus.volume}%
                </span>

            </div>


            <div class="control-section">


                <label>
                    Advertisement
                </label>


                <select
                    id="ad-${bus.bus_id}">


                    <option
                        value="ad_01.mp3">

                        Advertisement 01

                    </option>


                    <option
                        value="ad_02.mp3">

                        Advertisement 02

                    </option>


                    <option
                        value="ad_03.mp3">

                        Advertisement 03

                    </option>


                </select>


                <label>
                    Volume
                </label>


                <div class="volume-buttons">


                    <button
                        class="volume-button"
                        onclick="
                            changeVolume(
                                '${bus.bus_id}',
                                50
                            )
                        ">

                        50%

                    </button>


                    <button
                        class="volume-button"
                        onclick="
                            changeVolume(
                                '${bus.bus_id}',
                                80
                            )
                        ">

                        80%

                    </button>


                    <button
                        class="volume-button"
                        onclick="
                            changeVolume(
                                '${bus.bus_id}',
                                100
                            )
                        ">

                        100%

                    </button>


                </div>


                <button
                    class="play-button"
                    onclick="
                        playAdvertisement(
                            '${bus.bus_id}'
                        )
                    ">

                    <span class="button-icon">
                        ▶
                    </span>

                    Play Advertisement

                </button>


                <button
                    class="stop-button"
                    onclick="
                        stopBus(
                            '${bus.bus_id}'
                        )
                    ">

                    <span class="button-icon">
                        ■
                    </span>

                    Stop

                </button>


            </div>


        </div>

    `;

}


/* =========================
   CHANGE VOLUME
========================= */


async function changeVolume(
    busId,
    volume
) {

    try {

        const response =
            await fetch(

                `${API_URL}/buses/${busId}/volume/${volume}`,

                {
                    method: "POST"
                }

            );


        const result =
            await response.json();


        showNotification(
            `${busId} volume set to ${volume}%`
        );


        await loadBuses();


    } catch (error) {

        console.error(error);

        showNotification(
            "Could not change volume."
        );

    }

}


/* =========================
   PLAY ADVERTISEMENT
========================= */


async function playAdvertisement(
    busId
) {

    const advertisement =
        document.getElementById(
            "ad-" + busId
        ).value;


    try {

        const response =
            await fetch(

                `${API_URL}/buses/${busId}/advertisement/${advertisement}`,

                {
                    method: "POST"
                }

            );


        const result =
            await response.json();


        showNotification(
            `${advertisement} sent to ${busId}`
        );


        await loadBuses();


    } catch (error) {

        console.error(error);

        showNotification(
            "Could not send advertisement."
        );

    }

}


/* =========================
   STOP BUS
========================= */


async function stopBus(
    busId
) {

    try {

        const response =
            await fetch(

                `${API_URL}/buses/${busId}/stop`,

                {
                    method: "POST"
                }

            );


        const result =
            await response.json();


        showNotification(
            `${busId} advertisement stopped`
        );


        await loadBuses();


    } catch (error) {

        console.error(error);

        showNotification(
            "Could not stop the bus."
        );

    }

}


/* =========================
   START DASHBOARD
========================= */


loadBuses();


/* Refresh every 5 seconds */

setInterval(
    loadBuses,
    5000
);


</script>


</body>

</html>
